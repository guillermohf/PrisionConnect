<div class="p-4 sm:p-6 space-y-6 max-w-7xl mx-auto">

  <div class="bg-gradient-to-r from-[#006666] to-[#008080] rounded-lg p-4 sm:p-5 lg:p-6 text-white shadow-lg mb-6">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 sm:gap-4">
      <div class="flex-1">
        <h1 class="text-lg sm:text-xl lg:text-2xl font-bold">Gestión de Usuarios</h1>
        <p class="text-[#FEEBDD] text-xs sm:text-sm mt-1">Administra el personal institucional</p>
      </div>
      <button (click)="abrirModalAgregar()"
        class="w-full sm:w-auto px-4 sm:px-5 lg:px-6 py-2.5 sm:py-3 bg-white text-[#006666] rounded-lg hover:bg-[#FEEBDD] transition-all duration-200 font-bold flex items-center justify-center gap-2 shadow-md">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>
        <span>Nuevo Usuario</span>
      </button>
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    </div>

  <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 mb-6">
    <div class="flex flex-col md:flex-row gap-4 items-end">
      <div class="flex-1 w-full">
        <label class="block text-xs font-medium text-gray-700 mb-1">Buscar</label>
        <input type="text" [(ngModel)]="filtros.busqueda" (keyup)="aplicarFiltros()" placeholder="Nombre o correo..."
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 outline-none">
      </div>
      </div>
  </div>

  <div class="relative">
    @if (loading()) {
      <div class="absolute inset-0 bg-white/60 flex items-center justify-center z-10 backdrop-blur-sm">
        <div class="animate-spin rounded-full h-10 w-10 border-4 border-teal-600 border-t-transparent"></div>
      </div>
    }

    <prisionConnect-data-table
      [columns]="columnas"
      [data]="usuariosFiltrados"
      [showEdit]="false" 
      [showDelete]="true"
      (detail)="onVerDetalle($event)"
      (delete)="onCambiarEstado($event)">
      
      <ng-template #customActions let-user>
        <button (click)="usuarioSeleccionado = user; mostrarModalCambiarRol = true" 
          class="p-2 text-purple-600 hover:bg-purple-50 rounded-lg transition-colors"
          title="Cambiar Rol">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </button>
      </ng-template>

    </prisionConnect-data-table>
  </div>

  </div>

  @if (mostrarModalDetalle && usuarioSeleccionado) {
  <prisionConnect-usuarios-detalle-modal 
    [usuario]="usuarioSeleccionado" 
    (cerrar)="mostrarModalDetalle = false">
  </prisionConnect-usuarios-detalle-modal>
}

@if (mostrarModalCambiarRol && usuarioSeleccionado) {
  <prisionConnect-cambiar-rol-modal 
    [usuario]="usuarioSeleccionado" 
    (cerrar)="mostrarModalCambiarRol = false"
    (actualizado)="onAccionCompletada('Rol actualizado con éxito')">
  </prisionConnect-cambiar-rol-modal>
}

@if (mostrarModalCambiarEstado && usuarioSeleccionado) {
  <prisionConnect-cambiar-estado-modal 
    [usuario]="usuarioSeleccionado" 
    (cerrar)="mostrarModalCambiarEstado = false"
    (actualizado)="onAccionCompletada('Estado del usuario actualizado')">
  </prisionConnect-cambiar-estado-modal>
}

@if (mostrarModalAgregar) {
  <prisionConnect-usuarios-agregar-modal 
    [isOpen]="mostrarModalAgregar" 
    (isOpenChange)="mostrarModalAgregar = $event"
    (usuarioCreado)="onUsuarioAgregado()">
  </prisionConnect-usuarios-agregar-modal>
}
