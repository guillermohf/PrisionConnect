@if (showModal) {
  <prisionConnect-modal
    [isOpen]="showModal"
    title="Registrar Nuevo Visitante"
    (close)="closeModal()">

    <form [formGroup]="visitanteForm" (ngSubmit)="onSubmit()">
      
      <div class="p-6 space-y-6">

        <!-- Datos Personales -->
        <section>
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-teal-700">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            Datos Personales
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">

            <prisionConnect-input cedulaMask
              label="Cédula"
              [formControl]="$any(visitanteForm.controls['cedula'])"
              placeholder="000-0000000-0"
              (blur)="verificarCedulaDuplicada()"
              [required]="true"
              (inputChange)="aplicarMascaraCedula($event)">
            </prisionConnect-input>

            <prisionConnect-input
              label="Nombre"
              [formControl]="$any(visitanteForm.controls['nombre'])"
              placeholder="Ingresa el nombre"
              [required]="true">
            </prisionConnect-input>

            <prisionConnect-input
              label="Apellido"
              [formControl]="$any(visitanteForm.controls['apellido'])"
              placeholder="Ingresa el apellido"
              [required]="true">
            </prisionConnect-input>

          </div>
        </section>

        <!-- Información de Contacto -->
        <section>
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-teal-700">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            Información de Contacto
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">

            <prisionConnect-input telefonoMask
              label="Teléfono"
              type="tel"
              [formControl]="$any(visitanteForm.controls['telefono'])"
              placeholder="809-555-0000"
              [required]="true"
              (inputChange)="aplicarMascaraTelefono($event)">
            </prisionConnect-input>

            <prisionConnect-input
              label="Email"
              type="email"
              [formControl]="$any(visitanteForm.controls['email'])"
              placeholder="ejemplo@correo.com">
            </prisionConnect-input>

            <prisionConnect-input
              label="Dirección"
              [formControl]="$any(visitanteForm.controls['direccion'])"
              placeholder="Calle, número, sector, ciudad"
              [required]="true"
              class="md:col-span-2">
            </prisionConnect-input>

          </div>
        </section>

        <!-- Observaciones -->
        <section>
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-teal-700">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            Observaciones
          </h2>

          <prisionConnect-input
            type="textarea"
            [formControl]="$any(visitanteForm.controls['observaciones'])"
            placeholder="Notas adicionales sobre el visitante..."
            [rows]="4">
          </prisionConnect-input>
        </section>

        <!-- Línea Divisoria -->
        <div class="border-t border-gray-300 pt-4"></div>

        <!-- Botones -->
        <div class="flex justify-end gap-3">

          <prisionConnect-button
            type="button"
            variant="secondary"
            [disabled]="guardando()"
            (click)="closeModal()">
            Cancelar
          </prisionConnect-button>

          <prisionConnect-button
            type="submit"
            variant="primary"
            [disabled]="guardando()"
            [loading]="guardando()">
            Guardar Visitante
          </prisionConnect-button>

        </div>

      </div>

    </form>

  </prisionConnect-modal>
}
