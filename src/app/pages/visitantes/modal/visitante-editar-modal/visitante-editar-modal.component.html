@if (showModal) {
  <prisionConnect-modal
    [isOpen]="showModal"
    title="Editar Visitante"
    (close)="closeModal()">

    <form [formGroup]="visitanteForm" (ngSubmit)="onSubmit()">
      
      <div class="p-6 space-y-6">

        <div class="bg-teal-50 border-l-4 border-teal-600 p-4 rounded-r-lg">
          <div class="flex items-start gap-3">
            <svg class="w-5 h-5 text-teal-600 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <div>
              <h3 class="text-sm font-semibold text-teal-900">Editando Visitante</h3>
              <p class="text-xs text-teal-700 mt-1">La cédula no puede ser modificada</p>
            </div>
          </div>
        </div>

        <section>
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-teal-700">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            Datos Personales
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">

            <div>
              <label class="block text-xs text-gray-600 mb-1">Cédula *</label>
              <input
                type="text"
                formControlName="cedula"
                readonly
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg bg-gray-100 cursor-not-allowed">
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Nombre *</label>
              <input
                type="text"
                formControlName="nombre"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Apellido *</label>
              <input
                type="text"
                formControlName="apellido"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

          </div>
        </section>

        <section>
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-teal-700">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            Información de Contacto
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">

            <div>
              <label class="block text-xs text-gray-600 mb-1">Teléfono *</label>
              <input
                type="text"
                formControlName="telefono"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Email</label>
              <input
                type="email"
                formControlName="email"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div class="md:col-span-2">
              <label class="block text-xs text-gray-600 mb-1">Dirección *</label>
              <input
                type="text"
                formControlName="direccion"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

          </div>
        </section>

        <section>
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-teal-700">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            Observaciones
          </h2>

          <textarea
            formControlName="observaciones"
            rows="4"
            class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600 resize-none">
          </textarea>
        </section>

        <div class="border-t border-gray-300 pt-4"></div>

        <div class="flex justify-end gap-3">

          <button
            type="button"
            (click)="closeModal()"
            [disabled]="guardando()"
            class="px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 disabled:opacity-50">
            Cancelar
          </button>

          <button
            type="submit"
            [disabled]="guardando()"
            class="px-6 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 disabled:opacity-50 flex items-center gap-2">
            @if (guardando()) {
              <div class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></div>
              Actualizando...
            }
            @if (!guardando()) {
              Actualizar
            }
          </button>

        </div>

      </div>

    </form>

  </prisionConnect-modal>
}
