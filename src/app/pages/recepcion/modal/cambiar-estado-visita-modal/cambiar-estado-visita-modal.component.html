@if (isOpen && visita) {
  <prisionConnect-modal
    [isOpen]="isOpen"
    title="Cambiar Estado de Visita"
    (close)="cerrar()">

    <div class="p-6 space-y-6">

      <!-- Estado Actual -->
      <div class="bg-teal-50 border-l-4 border-teal-600 p-4 rounded-r-lg">
        <div class="flex items-start">
          <svg class="w-5 h-5 text-teal-600 mt-0.5 mr-3 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <div class="text-sm text-teal-800">
            <p class="font-medium">Estado actual: <span class="font-bold">{{ visita.estado }}</span></p>
            <p class="text-xs mt-1">Selecciona el siguiente estado según el proceso de la visita.</p>
          </div>
        </div>
      </div>

      <!-- Estados Disponibles -->
      <div class="space-y-3">

        @for (estado of estados; track estado.valor) {

          <button
            (click)="cambiarEstado(estado.valor)"
            [disabled]="procesando || estado.valor === visita.estado"
            class="w-full border-2 rounded-lg p-4 transition-all hover:shadow-md disabled:opacity-50 disabled:cursor-not-allowed"
            [class.border-yellow-300]="estado.color === 'yellow' && estado.valor !== visita.estado"
            [class.bg-yellow-50]="estado.color === 'yellow' && estado.valor !== visita.estado"
            [class.border-blue-300]="estado.color === 'blue' && estado.valor !== visita.estado"
            [class.bg-blue-50]="estado.color === 'blue' && estado.valor !== visita.estado"
            [class.border-purple-300]="estado.color === 'purple' && estado.valor !== visita.estado"
            [class.bg-purple-50]="estado.color === 'purple' && estado.valor !== visita.estado"
            [class.border-green-300]="estado.color === 'green' && estado.valor !== visita.estado"
            [class.bg-green-50]="estado.color === 'green' && estado.valor !== visita.estado"
            [class.border-orange-300]="estado.color === 'orange' && estado.valor !== visita.estado"
            [class.bg-orange-50]="estado.color === 'orange' && estado.valor !== visita.estado"
            [class.border-gray-300]="estado.color === 'gray' && estado.valor !== visita.estado"
            [class.bg-gray-50]="estado.color === 'gray' && estado.valor !== visita.estado"
            [class.border-gray-400]="estado.valor === visita.estado"
            [class.bg-gray-200]="estado.valor === visita.estado">

            <div class="flex items-center justify-between">

              <div class="flex items-center gap-3">

                @if (estado.valor === EstadoVisita.REGISTRADA) {
                  <svg class="w-6 h-6 text-yellow-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                  </svg>
                }

                @if (estado.valor === EstadoVisita.EN_REQUISA_ENTRADA) {
                  <svg class="w-6 h-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                }

                @if (estado.valor === EstadoVisita.EN_TRANSITO) {
                  <svg class="w-6 h-6 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M13 7l5 5m0 0l-5 5m5-5H6" />
                  </svg>
                }

                @if (estado.valor === EstadoVisita.EN_CURSO) {
                  <svg class="w-6 h-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                  </svg>
                }

                @if (estado.valor === EstadoVisita.PENDIENTE_REQUISA_SALIDA) {
                  <svg class="w-6 h-6 text-orange-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                }

                @if (estado.valor === EstadoVisita.FINALIZADA) {
                  <svg class="w-6 h-6 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                }

                <span class="font-medium text-gray-800">{{ estado.label }}</span>
              </div>

              @if (estado.valor === visita.estado) {
                <span class="px-3 py-1 text-xs font-semibold rounded-full bg-gray-400 text-white">Actual</span>
              } @else {
                <svg class="w-5 h-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
              }

            </div>
          </button>

        }

      </div>

    </div>

  </prisionConnect-modal>
}
