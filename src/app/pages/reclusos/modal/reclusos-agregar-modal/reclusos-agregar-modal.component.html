@if (showModal) {
  <prisionConnect-modal
    [isOpen]="showModal"
    title="Registrar Nuevo Recluso"
    (close)="cerrar()">

    <form [formGroup]="form" (ngSubmit)="guardar()">
      
      <div class="p-6 space-y-6">

        <!-- Información Personal -->
        <section>
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-teal-700">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            Información Personal
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">

            <prisionConnect-input
              label="Número de Identificación"
              [formControl]="$any(form.controls['numeroIdentificacion'])"
              placeholder="001234567"
              [required]="true">
            </prisionConnect-input>

            <prisionConnect-input
              label="Número de Expediente"
              [formControl]="$any(form.controls['numeroExpediente'])"
              placeholder="EXP-2024-001">
            </prisionConnect-input>

            <prisionConnect-input cedulaMask
              label="Cédula"
              [formControl]="$any(form.controls['cedula'])"
              placeholder="001-0000000-0"
              [required]="true"
              (inputChange)="aplicarMascaraCedula($event)">
            </prisionConnect-input>

            <prisionConnect-input
              label="Nombre"
              [formControl]="$any(form.controls['nombre'])"
              placeholder="Juan Carlos"
              [required]="true">
            </prisionConnect-input>

            <prisionConnect-input
              label="Apellido"
              [formControl]="$any(form.controls['apellido'])"
              placeholder="Pérez García"
              [required]="true">
            </prisionConnect-input>

            <prisionConnect-input
              label="Fecha de Nacimiento"
              type="date"
              [formControl]="$any(form.controls['fechaNacimiento'])"
              [required]="true">
            </prisionConnect-input>

            <prisionConnect-input
              label="Sexo"
              type="select"
              [formControl]="$any(form.controls['sexo'])"
              [required]="true"
              [options]="[
                { value: '', label: 'Seleccionar' },
                { value: 'Masculino', label: 'Masculino' },
                { value: 'Femenino', label: 'Femenino' }
              ]">
            </prisionConnect-input>

            <prisionConnect-input
              label="Nacionalidad"
              [formControl]="$any(form.controls['nacionalidad'])"
              placeholder="Dominicana"
              [required]="true">
            </prisionConnect-input>

            <prisionConnect-input
              label="Estado Civil"
              type="select"
              [formControl]="$any(form.controls['estadoCivil'])"
              [options]="[
                { value: '', label: 'Seleccionar' },
                { value: 'Soltero', label: 'Soltero' },
                { value: 'Casado', label: 'Casado' },
                { value: 'Union Libre', label: 'Unión Libre' },
                { value: 'Divorciado', label: 'Divorciado' },
                { value: 'Viudo', label: 'Viudo' }
              ]">
            </prisionConnect-input>

          </div>
        </section>

        <!-- Información de Contacto -->
        <section>
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-teal-700">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            Información de Contacto
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">

            <prisionConnect-input
              label="Dirección"
              type="textarea"
              [formControl]="$any(form.controls['direccion'])"
              placeholder="Calle, número, sector, ciudad"
              (rows)="2"
              [required]="true"
              class="md:col-span-2">
            </prisionConnect-input>

            <prisionConnect-input telefonoMask
              label="Teléfono"
              type="tel"
              [formControl]="$any(form.controls['telefono'])"
              placeholder="809-000-0000">
            </prisionConnect-input>

            <prisionConnect-input
              label="Nombre Contacto Emergencia"
              [formControl]="$any(form.controls['nombreContactoEmergencia'])"
              placeholder="María Pérez"
              [required]="true">
            </prisionConnect-input>

            <prisionConnect-input telefonoMask
              label="Teléfono de Emergencia"
              type="tel"
              [formControl]="$any(form.controls['telefonoEmergencia'])"
              placeholder="809-000-0000"
              [required]="true"
              class="md:col-span-2"
              (inputChange)="aplicarMascaraTelefono($event)">
            </prisionConnect-input>

          </div>
        </section>

        <!-- Información Penal -->
        <section>
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-teal-700">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
            </svg>
            Información Penal
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">

            <prisionConnect-input
              label="Delito"
              [formControl]="$any(form.controls['delito'])"
              placeholder="Descripción del delito"
              class="md:col-span-2">
            </prisionConnect-input>

            <prisionConnect-input
              label="Fecha de Ingreso"
              type="date"
              [formControl]="$any(form.controls['fechaIngreso'])"
              [required]="true">
            </prisionConnect-input>

            <prisionConnect-input
              label="Sentencia (años)"
              type="number"
              [formControl]="$any(form.controls['sentencia'])"
              placeholder="10">
            </prisionConnect-input>

            <prisionConnect-input
              label="Situación Legal"
              type="select"
              [formControl]="$any(form.controls['situacionLegal'])"
              [required]="true"
              [options]="[
                { value: '', label: 'Seleccionar' },
                { value: 'Procesado', label: 'Procesado' },
                { value: 'Condenado', label: 'Condenado' },
                { value: 'Prisión Preventiva', label: 'Prisión Preventiva' }
              ]">
            </prisionConnect-input>

            <prisionConnect-input
              label="Estado del Recluso"
              type="select"
              [formControl]="$any(form.controls['estado'])"
              [required]="true"
              [options]="[
                { value: '', label: 'Seleccionar' },
                { value: 'Activo', label: 'Activo' },
                { value: 'Libertad Condicional', label: 'Libertad Condicional' },
                { value: 'Trasladado', label: 'Trasladado' },
                { value: 'Fugado', label: 'Fugado' },
                { value: 'Fallecido', label: 'Fallecido' },
                { value: 'Liberado', label: 'Liberado' }
              ]">
            </prisionConnect-input>

            <prisionConnect-input
              label="Pabellón"
              [formControl]="$any(form.controls['pabellon'])"
              placeholder="A, B, C..."
              [required]="true">
            </prisionConnect-input>

            <prisionConnect-input
              label="Celda"
              [formControl]="$any(form.controls['celda'])"
              placeholder="101"
              [required]="true">
            </prisionConnect-input>

          </div>
        </section>

        <!-- Observaciones -->
        <section>
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-teal-700">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            Observaciones
          </h2>

          <prisionConnect-input
            type="textarea"
            [formControl]="$any(form.controls['observaciones'])"
            placeholder="Notas adicionales sobre el recluso..."
            [rows]="4">
          </prisionConnect-input>
        </section>

        <!-- Línea Divisoria -->
        <div class="border-t border-gray-300 pt-4"></div>

        <!-- Botones -->
        <div class="flex justify-end gap-3">

          <prisionConnect-button
            type="button"
            variant="secondary"
            [disabled]="guardando"
            (click)="cerrar()">
            Cancelar
          </prisionConnect-button>

          <prisionConnect-button
            type="submit"
            variant="primary"
            [disabled]="guardando || form.invalid"
            [loading]="guardando">
            Guardar Recluso
          </prisionConnect-button>

        </div>

      </div>

    </form>

  </prisionConnect-modal>
}
