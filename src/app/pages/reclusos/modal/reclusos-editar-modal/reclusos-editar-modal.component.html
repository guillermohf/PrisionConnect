@if (showModal && recluso) {
  <prisionConnect-modal
    [isOpen]="showModal"
    title="Editar Recluso"
    (close)="cerrar()">

    <form [formGroup]="form" (ngSubmit)="guardar()">
      
      <div class="p-6 space-y-6">

        <!-- Info Card -->
        <div class="bg-teal-50 border-l-4 border-teal-600 p-4 rounded-r-lg">
          <div class="flex items-start gap-3">
            <svg class="w-5 h-5 text-teal-600 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <div>
              <h3 class="text-sm font-semibold text-teal-900">Editando Recluso</h3>
              <p class="text-xs text-teal-700 mt-1">{{ recluso.nombreCompleto }}</p>
            </div>
          </div>
        </div>

        <!-- Información Personal -->
        <section>
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-teal-700">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            Información Personal
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">

            <div>
              <label class="block text-xs text-gray-600 mb-1">Número de Identificación *</label>
              <input
                type="text"
                formControlName="numeroIdentificacion"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Número de Expediente</label>
              <input
                type="text"
                formControlName="numeroExpediente"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Cédula *</label>
              <input
                type="text"
                formControlName="cedula"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Nombre *</label>
              <input
                type="text"
                formControlName="nombre"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Apellido *</label>
              <input
                type="text"
                formControlName="apellido"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Fecha de Nacimiento *</label>
              <input
                type="date"
                formControlName="fechaNacimiento"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Sexo *</label>
              <select
                formControlName="sexo"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
              </select>
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Nacionalidad *</label>
              <input
                type="text"
                formControlName="nacionalidad"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Estado Civil</label>
              <select
                formControlName="estadoCivil"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
                <option value="">Seleccionar</option>
                <option value="Soltero">Soltero</option>
                <option value="Casado">Casado</option>
                <option value="Union Libre">Unión Libre</option>
                <option value="Divorciado">Divorciado</option>
                <option value="Viudo">Viudo</option>
              </select>
            </div>

          </div>
        </section>

        <!-- Información de Contacto -->
        <section>
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-teal-700">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
            Información de Contacto
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">

            <div class="md:col-span-2">
              <label class="block text-xs text-gray-600 mb-1">Dirección *</label>
              <textarea
                formControlName="direccion"
                rows="2"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600 resize-none">
              </textarea>
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Teléfono</label>
              <input telefonoMask
                type="tel"
                formControlName="telefono"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Nombre Contacto Emergencia *</label>
              <input
                type="text"
                formControlName="nombreContactoEmergencia"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div class="md:col-span-2">
              <label class="block text-xs text-gray-600 mb-1">Teléfono de Emergencia *</label>
              <input telefonoMask
                type="tel"
                formControlName="telefonoEmergencia"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

          </div>
        </section>

        <!-- Información Penal -->
        <section>
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-teal-700">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
            </svg>
            Información Penal
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">

            <div class="md:col-span-2">
              <label class="block text-xs text-gray-600 mb-1">Delito</label>
              <input
                type="text"
                formControlName="delito"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Fecha de Ingreso *</label>
              <input
                type="date"
                formControlName="fechaIngreso"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Sentencia (años)</label>
              <input
                type="number"
                formControlName="sentencia"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Situación Legal *</label>
              <select
                formControlName="situacionLegal"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
                <option value="Procesado">Procesado</option>
                <option value="Condenado">Condenado</option>
                <option value="Prisión Preventiva">Prisión Preventiva</option>
              </select>
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Estado del Recluso *</label>
              <select
                formControlName="estado"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
                <option value="Activo">Activo</option>
                <option value="Libertad Condicional">Libertad Condicional</option>
                <option value="Trasladado">Trasladado</option>
                <option value="Fugado">Fugado</option>
                <option value="Fallecido">Fallecido</option>
                <option value="Liberado">Liberado</option>
              </select>
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Pabellón *</label>
              <input
                type="text"
                formControlName="pabellon"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

            <div>
              <label class="block text-xs text-gray-600 mb-1">Celda *</label>
              <input
                type="text"
                formControlName="celda"
                class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600">
            </div>

          </div>
        </section>

        <!-- Observaciones -->
        <section>
          <h2 class="text-sm font-semibold mb-3 flex items-center gap-2 text-teal-700">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            Observaciones
          </h2>

          <textarea
            formControlName="observaciones"
            rows="4"
            class="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-teal-600 resize-none">
          </textarea>
        </section>

        <!-- Línea Divisoria -->
        <div class="border-t border-gray-300 pt-4"></div>

        <!-- Botones -->
        <div class="flex justify-end gap-3">

          <button
            type="button"
            (click)="cerrar()"
            [disabled]="guardando"
            class="px-6 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 disabled:opacity-50">
            Cancelar
          </button>

          <button
            type="submit"
            [disabled]="guardando || form.invalid"
            class="px-6 py-2 bg-teal-600 text-white rounded-lg hover:bg-teal-700 disabled:opacity-50 flex items-center gap-2">
            @if (guardando) {
              <div class="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></div>
              Actualizando...
            }
            @if (!guardando) {
              Actualizar Recluso
            }
          </button>

        </div>

      </div>

    </form>

  </prisionConnect-modal>
}
