<!-- src/app/shared/components/modal/modal.component.html -->
<!-- 🎨 BRANDING: #006666, #008080, #1A2626 -->

@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm animate-fadeIn">
    <div class="relative w-[90%] max-w-7xl max-h-[90vh] bg-white rounded-xl shadow-2xl transform transition-all scale-100 overflow-hidden">
      
      <!-- HEADER -->
      <div class="px-6 py-4 border-b border-gray-200 flex items-center justify-between" style="background-color: #006666;">
        <h3 class="text-xl font-bold text-white">
          {{ title }}
        </h3>
        <button
          type="button"
          (click)="onClose()"
          class="w-10 h-10 rounded-full flex items-center justify-center text-white hover:bg-white/20 transition-colors">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- BODY -->
      <div class="overflow-y-auto max-h-[calc(90vh-80px)]">
        <ng-content></ng-content>
      </div>

    </div>
  </div>
}
